name: intel

on:
  schedule:
    - cron: "45 18 * * *" # 00:15 IST, so the DAY counter turns over at midnight
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["hud/**"]

permissions:
  contents: write

concurrency:
  group: intel
  cancel-in-progress: true

jobs:
  hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh live intel and rebuild the HUD
        run: python hud/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the HUD changed
        run: |
          git add assets hud/intel.json
          if git diff --cached --quiet; then
            echo "No change in intel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "intel: refresh HUD"
          git pull --rebase --autostash
          git push
