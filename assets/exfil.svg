<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 156" width="1000" height="156" role="img" aria-label="Exfil complete. STUXDAY out."><title>Exfil complete. STUXDAY out.</title><style>
text{font-family:'Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif}
